<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background glow / soft shadow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>

    <!-- Green 3D Figure Gradient (Main body) -->
    <linearGradient id="green3d" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="25%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Green Head Sphere Gradient -->
    <radialGradient id="headGreen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="40%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <!-- Swirl Stroke Gradients -->
    <linearGradient id="swirlGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="swirlGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>
    <linearGradient id="swirlGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="70%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Heart 3D Gradient -->
    <radialGradient id="heartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Wheel Rim Gradient -->
    <radialGradient id="wheelGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="30%" stop-color="#22c55e" />
      <stop offset="75%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#7f1d1d" flood-opacity="0.3" />
    </filter>
    <filter id="contactShadowFilter" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
    </filter>
  </defs>

  <!-- Circular Base (optional soft background) -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGlow)" />

  <!-- OUTER SWIRLING GREEN VORTEX WREATH -->
  <g id="swirl-wreath" opacity="0.95">
    <!-- Top Arc Swirl 1 -->
    <path d="M 120,80 C 180,35 320,30 400,90 C 440,120 465,160 472,210 C 465,150 425,100 370,70 C 300,32 190,40 120,80 Z" fill="url(#swirlGrad2)" />
    
    <!-- Top-Right Outer Tail -->
    <path d="M 250,38 C 340,38 430,90 465,170 C 480,205 485,250 475,290 C 482,240 470,195 440,150 C 395,85 320,48 250,38 Z" fill="url(#swirlGrad1)" />

    <!-- Right Flank Arc -->
    <path d="M 460,170 C 485,230 485,310 445,375 C 415,420 370,455 315,472 C 375,445 420,400 445,340 C 470,280 465,220 460,170 Z" fill="url(#swirlGrad3)" />

    <!-- Bottom Swirl Arc -->
    <path d="M 430,360 C 380,430 290,475 200,470 C 140,465 85,435 50,385 C 90,430 150,458 220,458 C 310,458 390,410 430,360 Z" fill="url(#swirlGrad1)" />

    <!-- Bottom-Left Sweep Arc -->
    <path d="M 280,475 C 190,478 105,435 60,365 C 30,315 22,250 35,190 C 25,250 38,320 80,380 C 130,440 210,472 280,475 Z" fill="url(#swirlGrad2)" />

    <!-- Left Flank Ascending Swirl -->
    <path d="M 65,340 C 35,275 35,195 75,130 C 110,75 170,40 240,28 C 160,42 95,85 60,155 C 30,215 35,285 65,340 Z" fill="url(#swirlGrad3)" />

    <!-- Inner dynamic wisps for authentic painted brush effect -->
    <path d="M 160,65 C 220,45 295,50 355,80 C 385,95 415,120 430,150 C 410,120 375,95 330,78 C 275,58 210,55 160,65 Z" fill="#84cc16" opacity="0.8" />
    <path d="M 445,180 C 465,230 460,290 435,340 C 410,390 365,430 310,450 C 360,425 400,385 422,335 C 445,285 445,230 445,180 Z" fill="#65a30d" opacity="0.7" />
    <path d="M 330,460 C 250,475 165,455 105,405 C 75,380 50,340 40,300 C 52,345 85,385 125,412 C 185,450 260,462 330,460 Z" fill="#84cc16" opacity="0.8" />
    <path d="M 50,280 C 38,225 50,165 85,115 C 120,70 175,45 230,35 C 165,48 110,80 75,135 C 48,180 40,230 50,280 Z" fill="#a3e635" opacity="0.85" />
    
    <!-- Fine inner motion brush splatters/feathers -->
    <path d="M 390,95 C 420,120 445,155 455,190 C 445,155 418,125 390,95 Z" fill="#4d7c0f" />
    <path d="M 440,350 C 410,395 365,430 320,448 C 360,425 400,390 440,350 Z" fill="#3f6212" />
    <path d="M 90,390 C 60,350 45,300 45,250 C 50,300 70,350 90,390 Z" fill="#4d7c0f" />
    <path d="M 68,140 C 95,95 140,65 190,50 C 135,68 95,100 68,140 Z" fill="#65a30d" />
  </g>

  <!-- FLOOR CONTACT SHADOW -->
  <ellipse cx="255" cy="396" rx="145" ry="12" fill="#64748b" opacity="0.32" filter="url(#contactShadowFilter)" />
  <ellipse cx="190" cy="395" rx="55" ry="8" fill="#334155" opacity="0.25" filter="url(#contactShadowFilter)" />
  <ellipse cx="320" cy="396" rx="65" ry="7" fill="#334155" opacity="0.25" filter="url(#contactShadowFilter)" />

  <!-- CENTRAL ICON FIGURES (Physiotherapist & Patient with Heart in Wheelchair) -->
  <g id="central-figures" filter="url(#softShadow)">

    <!-- ========================================== -->
    <!-- 1. PATIENT IN WHEELCHAIR (LEFT SIDE)       -->
    <!-- ========================================== -->

    <!-- Wheelchair Big Main Wheel Outer Rim -->
    <circle cx="185" cy="328" r="58" fill="none" stroke="url(#wheelGrad)" stroke-width="19" stroke-linecap="round" />
    <!-- Inner Rim Highlight -->
    <circle cx="185" cy="328" r="49" fill="none" stroke="#bbf7d0" stroke-width="2.5" opacity="0.5" />
    <!-- Wheel Hub Ring -->
    <circle cx="185" cy="328" r="28" fill="#ffffff" stroke="url(#green3d)" stroke-width="4.5" />

    <!-- VIBRANT RED HEART IN WHEEL HUB -->
    <g id="wheel-heart" filter="url(#heartShadow)" transform="translate(185, 326) scale(0.92) translate(-185, -326)">
      <path d="M 185,344 
               C 185,344 163,329 157,314 
               C 152,302 158,290 171,290 
               C 178,290 183,295 185,300 
               C 187,295 192,290 199,290 
               C 212,290 218,302 213,314 
               C 207,329 185,344 185,344 Z" 
            fill="url(#heartGrad)" />
      <!-- Heart Specular Reflection Highlight -->
      <ellipse cx="172" cy="296" rx="4" ry="2.5" fill="#fecaca" opacity="0.8" transform="rotate(-30 172 296)" />
    </g>

    <!-- Small Front Caster Wheel & Footrest of Wheelchair -->
    <g id="wheelchair-caster">
      <circle cx="245" cy="378" r="9" fill="url(#wheelGrad)" />
      <circle cx="245" cy="378" r="4" fill="#ffffff" />
      <path d="M 235,355 L 245,376" stroke="url(#green3d)" stroke-width="5" stroke-linecap="round" />
      <!-- Footrest -->
      <path d="M 225,365 L 248,365" stroke="url(#green3d)" stroke-width="5.5" stroke-linecap="round" />
    </g>

    <!-- Patient Body (Seated) -->
    <!-- Patient Thigh & Leg -->
    <path d="M 188,300 C 205,302 225,302 230,320 C 235,335 238,355 240,362" 
          fill="none" stroke="url(#green3d)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Patient Spine / Torso -->
    <path d="M 175,295 C 168,265 174,230 190,205" 
          fill="none" stroke="url(#green3d)" stroke-width="17" stroke-linecap="round" />

    <!-- Patient Arm extending forward to meet therapist -->
    <path d="M 185,225 C 205,220 235,225 255,225" 
          fill="none" stroke="url(#green3d)" stroke-width="13" stroke-linecap="round" />

    <!-- Patient Head -->
    <circle cx="195" cy="180" r="19" fill="url(#headGreen)" />
    <!-- Head 3D Specular Highlight -->
    <ellipse cx="190" cy="174" rx="5" ry="3.5" fill="#d9f99d" opacity="0.75" transform="rotate(-25 190 174)" />


    <!-- ========================================== -->
    <!-- 2. PHYSIOTHERAPIST PRACTITIONER (RIGHT)    -->
    <!-- ========================================== -->

    <!-- Back Leg (Left Leg of Therapist) -->
    <path d="M 330,285 C 322,315 315,350 305,388" 
          fill="none" stroke="url(#green3d)" stroke-width="17" stroke-linecap="round" />

    <!-- Forward Stance Leg (Right Leg of Therapist) -->
    <path d="M 345,285 C 362,315 385,350 400,388" 
          fill="none" stroke="url(#green3d)" stroke-width="17" stroke-linecap="round" />

    <!-- Therapist Torso leaning leftwards with care -->
    <path d="M 338,290 C 352,255 352,215 330,180" 
          fill="none" stroke="url(#green3d)" stroke-width="21" stroke-linecap="round" />

    <!-- Therapist Head -->
    <circle cx="330" cy="142" r="23" fill="url(#headGreen)" />
    <!-- Therapist Head Specular Highlight -->
    <ellipse cx="323" cy="134" rx="7" ry="4.5" fill="#d9f99d" opacity="0.8" transform="rotate(-30 323 134)" />

    <!-- Therapist Supporting Arm 1: Reaching down to guide the patient -->
    <path d="M 326,190 C 295,200 260,215 240,225" 
          fill="none" stroke="url(#green3d)" stroke-width="15" stroke-linecap="round" />

    <!-- Connecting Hand / Support Gesture between Doctor & Patient -->
    <path d="M 235,225 C 248,223 260,223 275,225" 
          fill="none" stroke="url(#headGreen)" stroke-width="11" stroke-linecap="round" />

    <!-- Therapist Shoulder Contour / Muscle Highlight -->
    <path d="M 345,175 C 352,190 354,210 350,225" 
          fill="none" stroke="#bbf7d0" stroke-width="3" opacity="0.45" stroke-linecap="round" />
  </g>
</svg>
